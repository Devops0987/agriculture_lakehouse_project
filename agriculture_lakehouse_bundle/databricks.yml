    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b2c987d0-9382.cloud.databricks.com
    variables:
      catalog: agriculture_lkh_dev
      # schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-b2c987d0-9382.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/abhijeet.waghmare@ltts.com to make sure we only have a single copy.
      root_path: /Workspace/Users/abhijeet.waghmare@ltts.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: agriculture_lkh_prod
      # schema: prod
    permissions:
      - user_name: abhijeet.waghmare@ltts.com
        level: CAN_MANAGE
